[neopixel rgb_panel]
pin: PC0
chain_count: 72
color_order: GRB
initial_RED: 0.0 # blue
initial_GREEN: 0.0 # red
initial_BLUE: 1.0 # green

[led_effect front_white]
autostart: true
frame_rate: 24
leds:
	neopixel:rgb_panel (1-18)
layers:
	breathing  3 1 top (0.0, 0.0, 1.0)

[led_effect all_white]
autostart:              false
frame_rate:             24
leds:
    neopixel:rgb_panel
layers:
    static  0 0 top (1.0, 1.0 ,1.0)

[led_effect back_idle]
autostart:              true
frame_rate:             24
leds:
    neopixel:rgb_panel (19-36)
layers:
    breathing  10 1 top (0.5, 0.5, 1.0)

[led_effect back_heating]
autostart:              false
frame_rate:             24
leds:
    neopixel:rgb_panel (19-36)
layers:
    breathing  3 1 top (1.0, 0.18, 0.0)

[led_effect back_moving]
autostart:              false
frame_rate:             24
leds:
    neopixel:rgb_panel (19-36)
layers:
    breathing  3 1 top (0.0, 1.0, 0.0)